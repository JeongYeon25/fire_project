{% load plant_ui %}
{# 알림이 하나도 없을 때(홈 최근 알림, 알림 기록 공통). first_waiting: 센서 연결 전·끊김 화분 #}
<div class="empty-cta">
  {% pixel "envelope" 28 "" %}
  <p>아직 받은 알림이 없어요. 물이나 빛이 부족해지거나 센서 연결이 끊기면 여기에 모여요.</p>
  {% if first_waiting %}
  <a class="btn btn--small" href="{% url 'plants:list' %}?open={{ first_waiting.pk }}">센서 연결하기</a>
  {% else %}
  <a class="btn btn--small btn--ghost" href="{% url 'alerts:settings' %}#setting-title">알림 설정 보기</a>
  {% endif %}
</div>
